# ============================================
# 飞书 × GitLab 智能发版控制台 - 配置模板
# ============================================
# 使用方法：复制此文件为 config.yaml 并填入真实值
#   cp config.example.yaml config.yaml

# ---- 飞书应用凭证 ----
feishu:
  app_id: "cli_xxxxxxxxxxxxxxxx"        # 飞书开放平台 -> 应用凭证 -> App ID
  app_secret: "xxxxxxxxxxxxxxxxxxxxxx"   # 飞书开放平台 -> 应用凭证 -> App Secret
  verification_token: "xxxxxxxxxxxx"     # 飞书开放平台 -> 事件订阅 -> Verification Token
  encrypt_key: ""                        # 如不使用加密可留空
  allow_from: []                         # IP白名单，留空则不限制

# ---- 服务监听 ----
server:
  bind_host: "0.0.0.0"
  bind_port: 18789

# ---- GitLab 配置 ----
gitlab:
  base_url: "http://your-gitlab-host:port"    # GitLab 实例地址
  access_token: "glpat-xxxxxxxxxxxx"           # GitLab Personal Access Token (需要 api 权限)

# ---- 项目配置 ----
# 支持多项目、多仓库、多环境、多微服务模块
projects:
  - name: "示例项目A"                          # 项目名称（同时也是触发词前缀，发送"示例项目A发版"即可唤醒卡片）
    environments: ["test", "prod"]             # 可选环境列表
    repos:
      - name: "前端仓库"                       # 仓库显示名
        repo: "group/frontend-repo"            # GitLab 仓库路径
        id: 1                                  # GitLab Project ID（必须准确）
      - name: "后端仓库"
        repo: "group/backend-repo"
        id: 2
        modules:                               # 【可选】微服务模块列表，配置后卡片会自动出现模块选择下拉框
          - "service-user"                     # 模块名会作为 TARGET_MODULE 变量传递给 GitLab Pipeline
          - "service-order"
          - "service-gateway"

  - name: "示例项目B"
    environments: ["test"]
    repos:
      - name: "主仓库"
        repo: "group/main-repo"
        id: 3
