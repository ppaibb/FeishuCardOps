# ============================================
# 飞书 × GitLab 智能发版控制台 - 配置模板
# ============================================
# 使用方法：复制此文件为 config.yaml 并填入真实值
#   cp config.example.yaml config.yaml

# ---- 飞书应用凭证 ----
feishu:
  app_id: "cli_xxxxxxxxxxxxxxxx"        # 飞书开放平台 -> 应用凭证 -> App ID
  app_secret: "xxxxxxxxxxxxxxxxxxxxxx"   # 飞书开放平台 -> 应用凭证 -> App Secret
  verification_token: "xxxxxxxxxxxx"     # 飞书开放平台 -> 事件订阅 -> Verification Token
  encrypt_key: ""                        # 如不使用加密可留空
  allow_from: []                         # IP白名单，留空则不限制
  audit_chat_id: ""                      # 【可选】发版通知/审计的微信/飞书群组 Chat ID（如：oc_xxxxxx）

# ---- 服务监听 ----
server:
  bind_host: "0.0.0.0"
  bind_port: 55000

# ---- GitLab 配置 ----
gitlab:
  base_url: "http://your-gitlab-host:port"    # GitLab 实例地址
  access_token: "glpat-xxxxxxxxxxxx"           # GitLab Personal Access Token (需要 api 权限)
# ---- Redis 存储配置 ----
redis:
  url: "redis://localhost:6379/0"             # 连接 URL (格式: redis://[:password]@host:port/db)

# ---- AI Code Review 配置 ----
ai:
  api_key: "sk-xxxxxxxxxxxx"                  # Anthropic 兼容 API Key
  base_url: "https://api.minimaxi.com/anthropic"  # API 地址（支持 Anthropic 兼容接口）
  model: "MiniMax-M2.7"                       # 模型名称

# ---- 项目配置 ----
# 支持多项目、多仓库、多环境、多微服务模块
projects:
  - name: "示例项目A"                          # 项目名称（同时也是触发词前缀，发送"示例项目A发版"即可唤醒卡片）
    environments: ["test", "prod"]             # 可选环境列表（注：若需在卡片显示如"本地机房"这样的中文别名，勿改此代码，请去 core/card_builder.py 的 get_env_display() 设置视图映射）
    repos:
      - name: "前端仓库"                       # 仓库显示名
        id: 1                                  # GitLab Project ID（必须准确）
        repo: "group/frontend-repo"            # GitLab 仓库路径
        variables:                             # 【新增】自定义环境变量注册（会自动在卡片生成下拉菜单）
          - key: "TARGET_PROFILE"              # 注入流水线的核心变量名
            label: "🎨 构建配置"               # 飞书卡片上显示的下拉框名字
            options: ["app", "admin", "portal"]# 可供选择的值

      - name: "后端仓库"
        id: 2
        repo: "group/backend-repo"
        variables:                             # 【动态变量引擎】取代了旧版硬编码的 modules
          - key: "TARGET_MODULE"
            label: "🧩 选微服务"
            options: ["service-user", "service-order", "service-gateway"]

  - name: "示例项目B"
    environments: ["test"]
    repos:
      - name: "主仓库"
        id: 3
        repo: "group/main-repo"

# ---- 权限控制 ----
# 基于飞书用户 open_id 的发版权限管理
# 不配置此节则所有用户均可操作（向后兼容）
permissions:
  default_policy: "allow"                      # 全局默认策略：allow (允许) / deny (拒绝)

  # 权限规则列表（从后往前匹配，最后一条匹配的规则优先）
  rules:
    # 所有人都可以在 test 环境发版
    - project: "*"                             # 匹配所有项目，也可指定项目名如 "示例项目A"
      env: "test"                              # 匹配环境名
      policy: "allow"                          # 该规则的策略

    # 生产环境仅允许白名单用户
    - project: "*"
      env: "prod"
      policy: "deny"                           # 默认拒绝
      allow_users:                             # 白名单用户（飞书 open_id）
        - "ou_xxxxxxxxxxxxxxxx"                # 运维负责人
        - "ou_yyyyyyyyyyyyyyyy"                # 技术经理

  # 审批流配置（可选）
  # 匹配的场景下，即使有权限也需要审批人批准后才能触发
  approval_required:
    - project: "*"
      env: "prod"
      approvers:                               # 审批人列表（飞书 open_id）
        - "ou_approver1xxxxxxxxxxxx"           # 审批人1
        - "ou_approver2xxxxxxxxxxxx"           # 审批人2
