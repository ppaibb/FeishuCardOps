version: "3.8"

services:
  redis:
    image: docker.1panel.live/library/redis:7-alpine
    container_name: feishu-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  feishu-gitlab-bot:
    build: .
    container_name: feishu-gitlab-bot
    restart: always
    ports:
      - "55000:55000"
    volumes:
      # 配置文件挂载（必须）- 修改后无需重新构建镜像
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx; r = httpx.get('http://127.0.0.1:55000/healthz', timeout=3); assert r.status_code == 200" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis_data:
